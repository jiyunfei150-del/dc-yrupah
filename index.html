<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能问数平台 · 主流程</title>
</head>
<body style="margin:0;padding:40px;background:#fff;display:flex;justify-content:center;">

<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 0,10 10,5" fill="#94a3b8"/>
    </marker>
    <marker id="arr-l" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse">
      <polygon points="10,0 10,10 0,5" fill="#94a3b8"/>
    </marker>
    <linearGradient id="g-user" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g-recv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="g-mem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="g-exec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="g-result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!--
    画布 1400×900，主干居中 cx=700

    主干节点: x=480, w=440, h=90
    节点右边: 920  → 连线80px → 记忆面板 left=1000, w=360 (right=1360)
    节点左边: 480  → 连线80px → DB面板 right=400, left=100, w=280

    连线标签位置：
      右侧标签: x=920 紧贴节点右边，充分展开
      左侧标签: x=400 紧贴节点左边，充分展开

    Y坐标:
      Node1: y=70,  cy=115
      Node2: y=220, cy=265
      Node3: y=370, cy=415
      Node4: y=520, cy=565
      Node5: y=670, cy=715

    记忆面板: h≈240, top=415-120=295
    DB面板:   h≈150, top=565-75=490
  -->

  <!-- Header -->
  <text x="700" y="36" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="800" fill="#0f172a">智能问数平台 · 主流程</text>
  <text x="700" y="58" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#94a3b8">用户自然语言提问 → 记忆系统生成 SQL → 连库执行 → 返回结果</text>

  <!-- 主干竖向箭头 cx=700 -->
  <line x1="700" y1="160" x2="700" y2="217" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="700" y1="310" x2="700" y2="367" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="700" y1="460" x2="700" y2="517" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="700" y1="610" x2="700" y2="667" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Node3右→记忆面板 连线(y=415): 920→998 -->
  <line x1="920" y1="415" x2="997" y2="415" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 返回虚线 y=435 -->
  <line x1="1000" y1="435" x2="922" y2="435" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-l)"/>

  <!-- Node4左→DB面板 连线(y=565): 480→402 -->
  <line x1="480" y1="565" x2="403" y2="565" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-l)"/>
  <!-- 返回虚线 y=585 -->
  <line x1="400" y1="585" x2="478" y2="585" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- NODE 1 -->
  <rect x="480" y="70" width="440" height="90" rx="16" fill="url(#g-user)" filter="url(#sh)"/>
  <text x="700" y="112" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">👤 用户提问</text>
  <text x="700" y="138" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">自然语言，如：本周 DAU 多少？</text>

  <!-- NODE 2 -->
  <rect x="480" y="220" width="440" height="90" rx="16" fill="url(#g-recv)" filter="url(#sh)"/>
  <text x="700" y="262" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">🖥️ 智能问数平台</text>
  <text x="700" y="288" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">接收消息，附带 user_id / project</text>

  <!-- NODE 3 -->
  <rect x="480" y="370" width="440" height="90" rx="16" fill="url(#g-mem)" filter="url(#sh)"/>
  <text x="700" y="412" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">🧠 检索记忆系统</text>
  <text x="700" y="438" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">获取 SQL</text>

  <!-- NODE 4 -->
  <rect x="480" y="520" width="440" height="90" rx="16" fill="url(#g-exec)" filter="url(#sh)"/>
  <text x="700" y="562" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">⚙️ 智能问数平台</text>
  <text x="700" y="588" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">连库分析，执行 SQL</text>

  <!-- NODE 5 -->
  <rect x="480" y="670" width="440" height="90" rx="16" fill="url(#g-result)" filter="url(#sh)"/>
  <text x="700" y="712" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">📊 用户收到结果</text>
  <text x="700" y="738" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">数据表格 / 图表展示</text>

  <!-- 连线标签（放在连线中段，远离节点边缘）-->
  <!-- 右侧: 连线 920→998, 标签放在 930 开始，完整展示 -->
  <rect x="928" y="401" width="64" height="18" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="960" y="414" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600" fill="#64748b">调用记忆系统</text>

  <!-- 左侧: 连线 480→402, 标签放在 410 开始，完整展示 -->
  <rect x="406" y="551" width="50" height="18" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="431" y="564" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600" fill="#64748b">执行 SQL</text>

  <!-- 记忆面板: x=1000, y=295, w=360, h=240 -->
  <rect x="1000" y="295" width="360" height="240" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1020" y="318" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">记忆系统 · 子流程</text>
  <line x1="1000" y1="327" x2="1360" y2="327" stroke="#e2e8f0" stroke-width="1"/>

  <circle cx="1026" cy="349" r="13" fill="#8b5cf6"/>
  <text x="1026" y="354" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">1</text>
  <text x="1048" y="345" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#1e293b">意图识别</text>
  <text x="1048" y="361" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">LLM 解析指标 / 时间 / 维度</text>
  <line x1="1000" y1="375" x2="1360" y2="375" stroke="#f1f5f9" stroke-width="1"/>

  <circle cx="1026" cy="395" r="13" fill="#3b82f6"/>
  <text x="1026" y="400" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">2</text>
  <text x="1048" y="391" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#1e293b">向量检索</text>
  <text x="1048" y="407" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">Weaviate 语义召回相关指标</text>
  <line x1="1000" y1="421" x2="1360" y2="421" stroke="#f1f5f9" stroke-width="1"/>

  <circle cx="1026" cy="441" r="13" fill="#10b981"/>
  <text x="1026" y="446" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">3</text>
  <text x="1048" y="437" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#1e293b">血缘查询</text>
  <text x="1048" y="453" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">Neo4j 图谱追踪字段来源</text>
  <line x1="1000" y1="467" x2="1360" y2="467" stroke="#f1f5f9" stroke-width="1"/>

  <circle cx="1026" cy="487" r="13" fill="#f59e0b"/>
  <text x="1026" y="492" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">4</text>
  <text x="1048" y="483" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#1e293b">SQL 组装</text>
  <text x="1048" y="499" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">LLM 生成 SQL，填充日期 / 条件</text>

  <rect x="1010" y="512" width="340" height="26" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1180" y="529" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#166534">↩ 返回 SQL 至智能问数平台</text>

  <!-- DB面板: x=100, y=490, w=280, h=150 -->
  <rect x="100" y="490" width="280" height="150" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="240" y="526" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28">🗄️</text>
  <text x="240" y="554" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#9a3412">ADB / SR / CK</text>
  <text x="240" y="572" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#c2410c">业务数仓 · 仅智能问数平台可连接</text>
  <rect x="114" y="585" width="252" height="26" rx="8" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="240" y="602" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#78350f">↩ 返回查询数据</text>

  <!-- Footer -->
  <text x="700" y="888" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#cbd5e1">Generated by 小D · DataClaw</text>
</svg>

</body>
</html>
