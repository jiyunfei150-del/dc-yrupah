<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能问数平台 · 主流程</title>
</head>
<body style="margin:0;padding:40px;background:#fff;display:flex;justify-content:center;">

<!--
  布局说明（坐标单位px）：
  画布: 1400×900
  主干节点: x=480, w=440, h=90, cx=700
  Node1 y=70, Node2 y=220, Node3 y=370, Node4 y=520, Node5 y=670

  记忆面板: x=1080, y=295, w=300, h=240
    节点Node3右边=920, 面板左边=1080, 连线区间=920~1080
    实线y=403: 节点→面板（调用），箭头→在面板侧 x=1080
    虚线y=436: 面板→节点（返回SQL），箭头←在节点侧 x=921

  DB面板: x=100, y=500, w=220, h=110, 右边=320
    节点Node4左边=480, 面板右边=320, 连线区间=320~480
    实线y=548: 节点→DB（执行SQL），箭头←在DB侧 x=328（面板外8px）
    虚线y=574: DB→节点（返回数据），箭头→在节点侧 x=480
-->

<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 0,10 10,5" fill="#94a3b8"/>
    </marker>
    <linearGradient id="g-user" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g-recv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="g-mem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="g-exec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="g-result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="700" y="36" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="800" fill="#0f172a">智能问数平台 · 主流程</text>
  <text x="700" y="58" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#94a3b8">用户自然语言提问 → 记忆系统生成 SQL → 连库执行 → 返回结果</text>

  <!-- 主干竖向箭头 -->
  <line x1="700" y1="160" x2="700" y2="217" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="700" y1="310" x2="700" y2="367" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="700" y1="460" x2="700" y2="517" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="700" y1="610" x2="700" y2="667" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ═══ 右侧：记忆系统连线 ═══
       实线y=403: 节点右边(920) ——[调用记忆系统]——▶ 面板左边(1080)
       虚线y=436: 面板左边(1080) ··[返回SQL]··◀ 节点右边(921)
  -->
  <!-- 实线: 920→957, 标签958~1042, 1043→1072, 箭头▶x=1080 -->
  <line x1="920" y1="403" x2="957" y2="403" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="958" y="392" width="84" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1000" y="406" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600" fill="#64748b">调用记忆系统</text>
  <line x1="1043" y1="403" x2="1072" y2="403" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="1072,399 1072,407 1080,403" fill="#94a3b8"/>

  <!-- 虚线: 1080→1045, 标签958~1042, 957→929, 箭头◀x=921 -->
  <line x1="1080" y1="436" x2="1045" y2="436" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="958" y="425" width="84" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1000" y="439" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600" fill="#166534">返回 SQL</text>
  <line x1="957" y1="436" x2="929" y2="436" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="929,432 929,440 921,436" fill="#94a3b8"/>

  <!-- ═══ 左侧：DB连线 ═══
       DB面板: x=100, w=220 → 右边=320
       节点左边=480
       连线区间: 320~480, 中点=400, 标签宽70 → x=365~435

       实线y=548: 节点(479)——[执行SQL]——▶ DB外侧(328)，箭头◀指向DB（←）
       虚线y=574: DB外侧(321)··[返回数据]··▶ 节点(480)，箭头▶指向节点（→）
  -->
  <!-- 实线: 479→437, 标签365~435, 364→337, 箭头◀x=328 -->
  <line x1="479" y1="548" x2="437" y2="548" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="365" y="537" width="70" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="551" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600" fill="#64748b">执行 SQL</text>
  <line x1="364" y1="548" x2="337" y2="548" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="337,544 337,552 328,548" fill="#94a3b8"/>

  <!-- 虚线: 321→363, 标签365~435, 436→470, 箭头▶x=480 -->
  <line x1="321" y1="574" x2="363" y2="574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="365" y="563" width="70" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="577" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600" fill="#166534">返回数据</text>
  <line x1="436" y1="574" x2="470" y2="574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="470,570 470,578 480,574" fill="#94a3b8"/>

  <!-- NODE 1 -->
  <rect x="480" y="70" width="440" height="90" rx="16" fill="url(#g-user)" filter="url(#sh)"/>
  <text x="700" y="112" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">👤 用户提问</text>
  <text x="700" y="138" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">自然语言，如：本周 DAU 多少？</text>

  <!-- NODE 2 -->
  <rect x="480" y="220" width="440" height="90" rx="16" fill="url(#g-recv)" filter="url(#sh)"/>
  <text x="700" y="262" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">🖥️ 智能问数平台</text>
  <text x="700" y="288" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">接收消息，附带 user_id / project</text>

  <!-- NODE 3 -->
  <rect x="480" y="370" width="440" height="90" rx="16" fill="url(#g-mem)" filter="url(#sh)"/>
  <text x="700" y="412" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">🧠 检索记忆系统</text>
  <text x="700" y="438" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">获取 SQL</text>

  <!-- NODE 4 -->
  <rect x="480" y="520" width="440" height="90" rx="16" fill="url(#g-exec)" filter="url(#sh)"/>
  <text x="700" y="562" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">⚙️ 智能问数平台</text>
  <text x="700" y="588" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">连库分析，执行 SQL</text>

  <!-- NODE 5 -->
  <rect x="480" y="670" width="440" height="90" rx="16" fill="url(#g-result)" filter="url(#sh)"/>
  <text x="700" y="712" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">📊 用户收到结果</text>
  <text x="700" y="738" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)">数据表格 / 图表展示</text>

  <!-- 记忆面板: x=1080, y=295, w=300, h=240 -->
  <rect x="1080" y="295" width="300" height="240" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1100" y="318" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">记忆系统 · 子流程</text>
  <line x1="1080" y1="327" x2="1380" y2="327" stroke="#e2e8f0" stroke-width="1"/>

  <circle cx="1104" cy="349" r="13" fill="#8b5cf6"/>
  <text x="1104" y="354" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">1</text>
  <text x="1126" y="345" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">意图识别</text>
  <text x="1126" y="361" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">LLM 解析指标 / 时间 / 维度</text>
  <line x1="1080" y1="375" x2="1380" y2="375" stroke="#f1f5f9" stroke-width="1"/>

  <circle cx="1104" cy="395" r="13" fill="#3b82f6"/>
  <text x="1104" y="400" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">2</text>
  <text x="1126" y="391" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">向量检索</text>
  <text x="1126" y="407" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">Weaviate 语义召回</text>
  <line x1="1080" y1="421" x2="1380" y2="421" stroke="#f1f5f9" stroke-width="1"/>

  <circle cx="1104" cy="441" r="13" fill="#10b981"/>
  <text x="1104" y="446" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">3</text>
  <text x="1126" y="437" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">血缘查询</text>
  <text x="1126" y="453" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">Neo4j 图谱追踪来源</text>
  <line x1="1080" y1="467" x2="1380" y2="467" stroke="#f1f5f9" stroke-width="1"/>

  <circle cx="1104" cy="487" r="13" fill="#f59e0b"/>
  <text x="1104" y="492" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="white">4</text>
  <text x="1126" y="483" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">SQL 组装</text>
  <text x="1126" y="499" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#94a3b8">LLM 生成并填充条件</text>

  <rect x="1090" y="512" width="280" height="26" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1230" y="529" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="600" fill="#166534">↩ 返回 SQL 至智能问数平台</text>

  <!-- DB面板: x=100, y=500, w=220, h=110, 右边=320 -->
  <rect x="100" y="500" width="220" height="110" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="210" y="530" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22">🗄️</text>
  <text x="210" y="552" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#9a3412">ADB / SR / CK</text>
  <text x="210" y="568" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#c2410c">业务数仓 · 仅智能问数平台可连接</text>
  <rect x="120" y="578" width="150" height="22" rx="8" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="195" y="593" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="600" fill="#78350f">返回查询数据 ↪</text>
